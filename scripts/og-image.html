<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

.container {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0d1a1a 100%);
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  position: relative; padding: 60px;
}

/* decorative circles */
.circle-1 {
  position: absolute; top: -120px; right: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(16,185,129,0.15), transparent 70%);
  border-radius: 50%;
}
.circle-2 {
  position: absolute; bottom: -80px; left: -80px;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 70%);
  border-radius: 50%;
}
.circle-3 {
  position: absolute; top: 50%; left: 50%;
  width: 500px; height: 500px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255,255,255,0.02), transparent 70%);
  border-radius: 50%;
}

/* grid pattern */
.grid {
  position: absolute; inset: 0;
  opacity: 0.04;
  background-image: 
    linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 40px 40px;
}

.content { position: relative; z-index: 1; text-align: center; }

.badge {
  display: inline-block;
  padding: 6px 18px;
  background: rgba(16,185,129,0.15);
  color: #34d399;
  font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  border-radius: 50px; margin-bottom: 20px;
}

h1 {
  font-size: 56px; font-weight: 800;
  background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px; margin-bottom: 12px;
}

.subtitle {
  font-size: 22px; color: #94a3b8; font-weight: 400;
  margin-bottom: 30px;
}

.tags {
  display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
}
.tag {
  padding: 5px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50px;
  font-size: 12px; color: #64748b; font-weight: 500;
  background: rgba(255,255,255,0.03);
}

.divider {
  width: 60px; height: 2px;
  background: linear-gradient(90deg, transparent, #10b981, transparent);
  margin: 0 auto 30px;
}
</style>
</head>
<body>
<div class="container">
  <div class="grid"></div>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>
  <div class="content">
    <div class="badge">Portfolio</div>
    <h1>Rizki Aditiya Ramadan</h1>
    <div class="divider"></div>
    <div class="subtitle">Creative Developer &amp; Digital Creator</div>
    <div class="tags">
      <span class="tag">Web Development</span>
      <span class="tag">Mobile Apps</span>
      <span class="tag">Video Production</span>
      <span class="tag">UI/UX Design</span>
    </div>
  </div>
</div>
</body>
</html>
